<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APEX-BI | MAGIE</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <style>
        body { padding: 20px; }
        .carte-resultat {
            margin-top: 30px;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            background-color: var(--pico-card-background-color);
            border: 1px solid var(--pico-card-border-color);
            animation: apparition 0.4s ease-out;
        }
        @keyframes apparition {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9em;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .badge-parier { background-color: #10b981; color: white; }
        .badge-refus { background-color: #ef4444; color: white; }
        .grille-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 20px;
            text-align: center;
            background: var(--pico-form-element-background-color);
            padding: 15px;
            border-radius: 8px;
        }
        .grille-stats small { color: var(--pico-muted-color); display: block; margin-bottom: 5px; }
        .grille-stats strong { font-size: 1.2em; }
        @media (max-width: 600px) {
            .grille-stats { grid-template-columns: 1fr; gap: 10px; }
        }
    </style>
</head>
<body>
    <main class="container">
        <nav style="margin-bottom: 20px;">
            <ul>
                <li><strong>🏀 APEX-BI</strong></li>
            </ul>
            <ul>
                <li><a href="/historique" role="button" class="outline">Voir l'historique 📖</a></li>
            </ul>
        </nav>

        <form id="formulaire">
            <div class="grid">
                <label>Équipe A
                    <input type="text" id="equipe_A" value="Lakers" required>
                </label>
                <label>Équipe B
                    <input type="text" id="equipe_B" value="Celtics" required>
                </label>
            </div>
            
            <label>Marché analysé
                <select id="marche">
                    <option value="passes">Passes (Assists)</option>
                    <option value="rebonds">Rebonds</option>
                    <option value="fautes">Fautes</option>
                </select>
            </label>

            <!-- LE NOUVEAU MENU EST ICI -->
            <label>Avantage du terrain
                <select id="avantage_terrain">
                    <option value="neutre">Terrain Neutre</option>
                    <option value="domicile_A">Équipe A joue à domicile</option>
                    <option value="domicile_B">Équipe B joue à domicile</option>
                </select>
            </label>

            <div class="grid">
                <label>Ligne (Over/Under)
                    <input type="number" step="0.5" id="ligne" value="52.5" required>
                </label>
                <label>Cote Over
                    <input type="number" step="0.01" id="cote_over" value="1.90" required>
                </label>
                <label>Cote Under
                    <input type="number" step="0.01" id="cote_under" value="1.90" required>
                </label>
            </div>

            <button type="submit" id="btn-analyser">Analyser le match</button>
        </form>

        <div id="resultat" style="display:none;"></div>
    </main>

    <script>
        document.getElementById('formulaire').addEventListener('submit', async (e) => {
            e.preventDefault(); 
            
            const btn = document.getElementById('btn-analyser');
            btn.setAttribute('aria-busy', 'true'); 
            btn.innerText = "Analyse en cours...";

            // C'EST ICI QUE LA LIGNE MAGIQUE SE TROUVE
            const donnees = {
                equipe_A: document.getElementById('equipe_A').value,
                equipe_B: document.getElementById('equipe_B').value,
                marche: document.getElementById('marche').value,
                avantage_terrain: document.getElementById('avantage_terrain').value, // <--- La voici !
                ligne: parseFloat(document.getElementById('ligne').value),
                cote_over: parseFloat(document.getElementById('cote_over').value),
                cote_under: parseFloat(document.getElementById('cote_under').value)
            };

            try {
                const reponse = await fetch('/analyser', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(donnees)
                });
                
                const data = await reponse.json();
                const divResultat = document.getElementById('resultat');
                
                if (reponse.ok) {
                    const decision = data.decision_financiere.decision;
                    const badgeCss = decision.includes('PARIER') ? 'badge-parier' : 'badge-refus';
                    
                    divResultat.innerHTML = `
                        <article class="carte-resultat">
                            <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                                <h3 style="margin: 0;">${data.match}</h3>
                                <span class="badge ${badgeCss}">${decision}</span>
                            </header>
                            <div class="grille-stats">
                                <div>
                                    <small>Total attendu</small>
                                    <strong>${data.analyse_sportive.total_attendu}</strong>
                                </div>
                                <div>
                                    <small>Proba Modèle (Over)</small>
                                    <strong>${(data.decision_financiere.p_over_modele * 100).toFixed(1)}%</strong>
                                </div>
                                <div>
                                    <small>Valeur Espérée (EV)</small>
                                    <strong>${(data.decision_financiere.ev_choisie * 100).toFixed(1)}%</strong>
                                </div>
                            </div>
                        </article>
                    `;
                    divResultat.style.display = 'block';
                } else {
                    alert("Erreur : " + data.detail);
                }
            } catch (error) {
                alert("Erreur de connexion au serveur.");
            } finally {
                btn.removeAttribute('aria-busy');
                btn.innerText = "Analyser le match";
            }
        });
    </script>
</body>
    </html>
